[package]
name = "qplanck-native"
version = "0.3.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Required native compiler and QIR kernel for QCore by QPlanck"
license = "Apache-2.0"
repository = "https://github.com/qplanck/qcore"
publish = false

[lib]
name = "_qplanck_native"
crate-type = ["cdylib", "rlib"]
path = "native/src/lib.rs"

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["abi3-py311"], optional = true }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = { version = "=1.0.138", features = ["preserve_order"] }
sha2 = "=0.10.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
