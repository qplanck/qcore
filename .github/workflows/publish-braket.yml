name: Publish qplanck-braket to TestPyPI

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_QPLANCK_BRAKET_0.1.0A1_TO_TESTPYPI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.confirmation == 'PUBLISH_QPLANCK_BRAKET_0.1.0A1_TO_TESTPYPI' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install adapter quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build mypy pytest ruff twine 'amazon-braket-sdk>=1.124,<1.125'

      - name: Test, type-check, build, and inspect adapter artifacts
        working-directory: packages/qplanck-braket
        env:
          PYTHONPATH: src:../../src
        run: |
          python -m ruff check .
          python -m pytest -q
          python -m mypy src/qplanck_braket scripts/live_smoke.py
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              assert any(name.endswith("/LICENSE") for name in archive.namelist())
          with tarfile.open(sdist) as archive:
              assert any(name.endswith("/LICENSE") for name in archive.getnames())
          PY

      - name: Smoke-test the wheel with the pinned provider SDK
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pip install --no-deps --force-reinstall packages/qplanck-braket/dist/*.whl
          python -c "import qplanck_braket; print(qplanck_braket.BraketPulseBackend.__name__)"

      - uses: actions/upload-artifact@v4
        with:
          name: qplanck-braket-dist
          path: packages/qplanck-braket/dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qplanck-braket-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
